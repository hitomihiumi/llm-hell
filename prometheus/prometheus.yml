global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: llmhell-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: vllm-glm-4.7
    # host.docker.internal, not the RunPod host directly: we reach the pod
    # over an SSH tunnel terminating on this host, and a container can't
    # reach a host-bound port except through this alias (which needs the
    # extra_hosts host-gateway entry in docker-compose.yml on Linux).
    static_configs:
      - targets: ["host.docker.internal:8010"]
    metrics_path: /metrics

  # GLM 4.7 Flash is not deployed - the planner checkpoint alone is ~205GB
  # and the pod's /workspace quota couldn't hold both. Left commented
  # rather than deleted so re-enabling is a two-line change: uncomment,
  # and re-open the matching SSH tunnel on this host. Scraping it while
  # nothing serves it just floods the tunnel with refused connections.
  # - job_name: vllm-glm-4.7-flash
  #   static_configs:
  #     - targets: ["host.docker.internal:8002"]
  #   metrics_path: /metrics
